[package]
name = "markdownz"
version = "0.4.1"
description = "Fast cross-platform Markdown viewer"
authors = ["drzdez"]
license = "MIT"
repository = "https://github.com/drzdez/markdownz"
edition = "2021"
rust-version = "1.80"

[lib]
name = "markdownz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dunce = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# "Open with" chooser through xdg-desktop-portal (works inside Flatpak too).
ashpd = { version = "0.13", default-features = false, features = ["tokio", "open_uri"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
